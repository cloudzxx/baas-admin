services:
  baas-admin-dashboard:
    image: baas-admin/dashboard
    container_name: baas-admin-dashboard
    ports:
      - "${DASHBOARD_SERVICE_PORT}:8081"
    networks:
      - baas-admin-net
    depends_on:
      - baas-admin-api-engine

  # pg database
  baas-admin-postgres:
    image: postgres:12.0
    container_name: baas-admin-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=api_engine
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
    ports:
      - "5432:5432"
    volumes:
      - ${BAAS_STORAGE_PATH:-/opt/baas-admin}/pgdata:/var/lib/postgresql/data
    networks:
      - baas-admin-net

  # api engine service of baas-admin 
  baas-admin-api-engine:
    image: baas-admin/api-engine
    container_name: baas-admin-api-engine
    restart: unless-stopped
    stdin_open: true
    dns_search: .
    environment:
      - GODEBUG=netdns=go
      - DB_NAME=api_engine
      - DB_USER=postgres
      - DB_PASSWORD=123456
      - DB_HOST=baas-admin-postgres
      - CELERY_BROKER_URL=redis://redis
      - DB_PORT=5432
      - DEBUG=True
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - API_ENGINE_ADMIN_EMAIL=admin@baas-admin.com
    ports:
      - "8080:8080"
    volumes:
      - ${BAAS_STORAGE_PATH:-/opt/baas-admin}:/opt/baas-admin
    networks:
      - baas-admin-net
    depends_on:
      - baas-admin-postgres

networks:
  baas-admin-net:
    name: baas-admin-net

volumes:
  baas-admin-api-engine:
  baas-admin-postgres:
  baas-admin-dashboard:
