#
# Local `/opt/baas-admin` will be used for the db storage.

#  baas-admin-nginx: proxy to access operator dashboard service, listen on 8080
#  baas-admin-operator-dashboard: dashboard service for operators
#  baas-admin-user-dashboard: user service of baas-admin, listen on 8081
#  engine: engine service of baas-admin to provide RESTful APIs, listen on 80
#  baas-admin-mongo: mongo db

version: '3.2'
services:
  nginx:
    image: baas-admin/nginx
    hostname: baas-admin-nginx
    container_name: baas-admin-nginx
    restart: always
    links:
    - api-engine
    ports:
    - "${CONFIG_API_ENGINE_SERVICE_PORT}:80"
    environment:
    - UWSGI_SERVER_HOST=api-engine
    - URL_PREFIX=${CONFIG_API_ENGINE_WEBROOT}
    volumes:
    - /opt/baas-admin/api-engine/media:/var/www/media

  postgres-server:
    image: postgres:12.0
    hostname: baas-admin-postgres-server
    container_name: baas-admin-postgres-server
    restart: always
    environment:
    - POSTGRES_DB=api-engine
    - POSTGRES_USER=$POSTGRES_USER
    - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
    volumes:
    - /opt/baas-admin/postgres:/var/lib/postgresql/data

  redis:
    image: redis:4.0.13
    hostname: baas-admin-redis
    container_name: baas-admin-redis
    volumes:
    - /opt/baas-admin/redis:/data

  api-engine:
    image: baas-admin/api-engine
    hostname: baas-admin-api-engine
    container_name: baas-admin-api-engine
    restart: always
    links:
    - postgres-server
    - redis
    environment:
    - WEBROOT=${API_ENGINE_WEBROOT}
    - DEBUG=False
    - DB_USER=${POSTGRES_USER}
    - DB_PASSWORD=${POSTGRES_PASSWORD}
    - DB_NAME=api-engine
    - DB_HOST=postgres-server
    - DB_PORT=5432
    - ADMIN_TOKEN=$API_ENGINE_ADMIN_TOKEN
    - CELERY_BROKER_URL=redis://redis
    - ADMIN_USERNAME=$API_ENGINE_ADMIN_USERNAME
    - ADMIN_PASSWORD=$API_ENGINE_ADMIN_PASSWORD
    - ADMIN_EMAIL=$API_ENGINE_ADMIN_EMAIL
    - API_VERSION=$API_VERSION
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /opt/baas-admin/api-engine/media:/var/www/media
    depends_on:
    - postgres-server


  api-engine-tasks:
    image: baas-admin/api-engine
    hostname: baas-admin-api-engine-tasks
    container_name: baas-admin-api-engine-tasks
    restart: always
    links:
    - postgres-server
    - redis
    environment:
    - WEBROOT=${API_ENGINE_WEBROOT}
    - DEBUG=True
    - DB_USER=${POSTGRES_USER}
    - DB_PASSWORD=${POSTGRES_PASSWORD}
    - DB_NAME=api-engine
    - DB_HOST=postgres-server
    - DB_PORT=5432
    - ADMIN_TOKEN=$API_ENGINE_ADMIN_TOKEN
    - CELERY_BROKER_URL=redis://redis
    - API_VERSION=$API_VERSION
    - DOCKER_HOST=$API_DOCKER_HOST
    - RUN_MODE=task
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
    - postgres-server

  dashboard:
    image: baas-admin/dashboard
    container_name: baas-admin-dashboard
    links:
    - nginx
    environment:
    - API_PROXY=http://nginx:80/engine
    - SERVICE_PORT=$API_ENGINE_SERVICE_PORT
    ports:
    - "${DASHBOARD_SERVICE_PORT}:80"
