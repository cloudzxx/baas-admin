kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: "{{ template "baas-admin-master.fullname" . }}-user-dashboard"
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.autoStorageClass }}
  storageClassName: "{{ template "baas-admin-master.fullname" . }}-user-dashboard"
  {{- else }}
  {{- if (eq "-" .Values.userDashboard.storageClass) }}
  storageClassName: ""
  {{- else }}
  storageClassName: "{{ .Values.userDashboard.storageClass }}"
  {{- end }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.userDashboard.size }}
